name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The project gradle.properties pins org.gradle.java.home to a macOS path; a user-level
      # ~/.gradle/gradle.properties takes precedence, so the build works on Linux runners.
      - name: Point Gradle at the runner JDK
        run: echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Quality gate + assemble
        run: ./gradlew qualityGate assembleDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/**'
          if-no-files-found: ignore
